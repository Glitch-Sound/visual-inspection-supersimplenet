[project]
name = "visual-inspection-supersimplenet"
version = "0.1.0"
description = "SuperSimpleNetによる画像準備・モデル学習・外観検査のCLI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anomalib==2.6.2",
    "filelock>=3.32.2",
    "loguru>=0.7.3",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.12.0.88",
    "optuna>=4.5.0",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "typer>=0.27.1",
]

[project.scripts]
check = "app.image_preparation.cli:check_cli"
train-pre = "app.image_preparation.cli:train_pre_cli"
train = "app.model_training.cli:train_cli"
test-pre = "app.image_preparation.cli:test_pre_cli"
test = "app.model_evaluation.cli:test_cli"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]
