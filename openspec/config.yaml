# このテンプレートで新規 change を作成するときの既定ワークフロー。
schema: my-workflow

# すべての成果物に適用する、案件に依存しない共通ルール。
context: |
  ## 共通原則
  - 成果物とチャット応答は日本語で記述する。
  - 変更前に `openspec/product.md`、`openspec/tech.md`、`openspec/structure.md`、既存コード、設定を確認する。
  - 共通文書はテンプレート基盤として扱い、案件固有の業務要件、外部連携、データモデルは change の成果物に記載する。
  - 実際のコード、依存関係、公開インターフェースと共通文書に差異がある場合は、既存コードと設定を根拠に影響を確認する。

  ## 要件と検証
  - proposal は目的・業務フロー・運用開始条件、spec は何を満たすか、design はどう満たすか、tasks は何を実施するかを扱う。
  - 要件は利用者または外部システムから観測可能かつ検証可能に記述し、EARS記法と Given/When/Then のScenarioを使用する。
  - 正常系だけでなく、入力不備、処理失敗、未判定、再実行、境界値、権限不足のうち案件に影響する分岐を検討し、利用者への結果と運用上の扱いを明記する。該当しない観点は理由を示して省略できる。
  - 機能要件は `REQ-001`、非機能要件は `NREQ-001`、Scenarioは `<要件ID>-S01`、試験ケースは `TC-001` 形式で管理する。採番済みIDは再利用・再採番しない。
  - 実装変更を伴うScenarioには自動テストコードを作成する。テストコードが不要な文書変更は、設計書に理由を記録する。
  - 自動試験の成功と実機・対象OSの確認を区別し、試験ごとの検証範囲、残る検証、証跡を記録する。収集・テスト成功だけで未実施の受け入れ確認を完了扱いにしない。
  - proposal の受け入れ条件は `- AC-001: <条件>` 形式で一意のIDを付け、design の「受け入れ検証」に検証範囲・条件、検証方法、残る検証、状態、証跡を対応付ける。
  - 案件固有の品質目標、数値、閾値、承認者、責任分界は推測せず、必要であれば未決事項として決定者と確定が必要な工程を示す。実装可否を左右する未決事項は、解決するまで設計・タスクを確定しない。

  ## 変更時の原則
  - 仕様にない重要な判断、互換性への影響、未解決のブロッカーは、実装前に change の成果物または利用者との合意へ反映する。
  - 関係のないリファクタリングや依存関係更新を同じ変更に混在させない。

rules:
  specs:
    - 各要件には `REQ-001` または `NREQ-001` のID、EARS記法の本文、1つ以上のScenarioを記載する。
    - Scenario は内部実装ではなく外部から観測できる結果を示し、案件に該当する例外時の結果と運用上の扱いを含める。
    - "「試験方針」に試験層、試験パターン、自動化方針を記載する。"
  design:
    - 要件を責務・境界、設計節、実装タスク、TC-ID、検証方法に対応付ける。
    - 業務フローを満たす責務、データ契約、失敗時の結果、復旧方法、重要な技術判断と根拠を記載する。
    - 実装方式の比較中は候補と確定条件を示し、未確認のモジュール名、ファイル名、pytest 関数名を早期に固定しない。タスク確定前に実装に必要な判断と試験実装先を確定する。
    - "「試験設計」で全ScenarioをTC-ID、テスト実装先、前提・操作・期待値に対応付け、「網羅性確認」で対応漏れを確認する。"
    - "試験設計に検証範囲、残る検証、証跡を記載する。実機スモーク等が別途必要なら自動試験だけで期待結果全体を確認したとしない。"
    - "「受け入れ検証」は「受け入れID / 検証範囲・条件 / 検証方法 / 残る検証 / 状態 / 証跡」の6列とする。通常の完了時は全AC-IDの状態を「検証済み」、残る検証を「なし」とし、証跡にリポジトリルート相対の空でない実在ファイルを記載する。制限付きアーカイブで延期する確認は「未検証」として残す。"
  tasks:
    - 確定した design の責務、契約、判断、試験設計から実施作業へ展開する。
    - 各タスクに一意なタスク番号、確定した変更対象、具体的な実施内容、対応する要件・設計節・TC-ID、完了条件を記載する。
    - 全TC-IDに対応する自動テスト実装と品質確認のタスクを含める。
    - 全AC-IDについて対象環境での確認と証跡記録のタスクを含める。環境を利用できず延期する場合は該当タスクを未完了のままにし、制限付きアーカイブの引き継ぎ記録と対応付ける。

operations:
  apply:
    guidance:
      - 実装前に proposal、specs、design、tasks と既存コードを確認する。
      - 実装後は、プロジェクトで定義されたlint、format、型検査、テストを実行する。
      - 実装後に `uv run --locked python scripts/check_openspec_traceability.py --change <change-name> --phase implementation` で参照テストが収集可能か確認する。
  archive:
    guidance:
      - アーカイブ前に `npx --no-install openspec validate <change-name> --strict` を実行する。
      - アーカイブ前に通常は `--phase complete`、制限付きアーカイブでは `--phase limited-archive` のトレーサビリティ検査を実行し、失敗した場合はアーカイブしない。
      - design の「受け入れ検証」の証跡を読み、全条件の検証範囲と対象環境が十分であることを確認する。機械検査の成功だけで証跡の内容が正しいと判断しない。
      - 制限付きアーカイブは利用できない実機・対象OS等の受け入れ検証だけが残る場合に限る。`archive-deferred.md` の延期理由、実施責任者、再開条件、追跡先と、未検証の受け入れ条件・未完了タスクの対応をレビューする。追跡先は README.md 等のリポジトリ内 Markdown 文書に記録し、GitHub Issue や別の spec を必須としない。残るリスクを利用者へ示し明示的な了承を得る。実装・自動試験・品質確認の未完了や重要な未解決事項があればアーカイブしない。
