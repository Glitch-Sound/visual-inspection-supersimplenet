name: my-workflow
version: 1
description: 業務目的・運用判断から実装へ展開する、日本語・EARS 記法の Python プロジェクト向け OpenSpec ワークフロー
artifacts:
  - id: proposal
    generates: proposal.md
    description: 利用者の目的、現行・変更後の業務フロー、運用開始条件を定める提案書
    template: proposal.md
    instruction: >
      proposal.md を日本語で作成する。現行の業務、利用者・運用者の目的と判断、解決する問題、変更後の業務フローを時系列で記述する。
      「対象範囲」と「運用開始の受け入れ条件」で対象・非対象・運用開始の判定を明確にする。該当しない業務項目は理由を示して省略できる。「変更する能力」は proposal と spec の契約であるため、
      既存仕様を調査し、追加または変更する capability の正確なパスを記述する。実装方法は design.md に記述し、
      proposal にはモジュール名、ファイル配置、ライブラリなどを含めない。仕様レベルの振る舞いが変わらない変更は .openspec.yaml の skip_specs: true を使用する。
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: capability ごとの検証可能な振る舞いを定義する差分仕様
    template: spec.md
    instruction: >
      proposal.md の「変更する能力」に対応する spec ファイルを日本語で作成する。仕様は実装計画ではなく、利用者または
      外部システムから観測できる振る舞いの契約とする。OpenSpec CLI の予約識別子である Purpose、ADDED / MODIFIED /
      REMOVED / RENAMED Requirements、Requirement:、Scenario: と所定の見出しレベルは英語のまま維持し、それ以外の
      章・項のタイトル、要件名、Scenario 名、本文、表見出しは日本語で記述する。Purpose には対象者、利用場面、
      得られる結果と、その結果から可能になる判断を非開発者にも分かる言葉で記載し、必要な業務用語・状態・判定区分は
      意味と運用上の扱いを説明する。各 Requirement は利用者価値が分かる日本語名とし、EARS 記法で、単一かつ検証可能な
      「条件・トリガー・結果」を規定する。本文だけでは判断しにくい場合は、対象者、利用場面、入力・開始条件、受け取る
      結果、判断・次の行動、業務ルール・制約を補足する。実装のクラス、関数、ライブラリ、処理手順は含めない。各 Requirement には
      必ず #### Scenario: 見出しのシナリオを1つ以上含め、WHEN と THEN に利用者または外部システムから観測できる操作と結果を記述する。新規 capability には
      50文字以上の Purpose を記述する。機能要件には `REQ-001`、非機能要件には `NREQ-001` 形式の一意で不変なIDを付け、
      Scenario には `<要件ID>-S01` 形式のIDを付ける。spec.md には要件区分ごとの試験層、試験パターン、自動化必須条件を定める
      「試験方針」を記載する。正常系に加え、入力不備、処理失敗、未判定、再実行など業務に影響する例外について、理由、
      状態変更、保持されるデータ、復旧または次の行動を検討し、該当しない場合は理由を示す。非機能要件は測定条件と利用者・
      運用者が確認できる品質結果を記載する。案件固有の品質目標や承認者を推測せず、実装可否または運用判断を左右する場合は
      「未決事項」に決定者、影響、確定工程、未決時の扱いを明記する。既存要件を変更する場合は Requirement ブロック全体を
      MODIFIED Requirements に複写して更新し、廃止には利用者への影響を説明する Reason と代替・移行方法を示す Migration を含める。
    requires:
      - proposal
  - id: design
    generates: design.md
    description: 仕様を満たす実装方法と技術判断を定義する設計書
    template: design.md
    instruction: >
      proposal.md と specs を根拠に、design.md を日本語で作成する。spec の全要件を「要件トレーサビリティ」で
      責務・境界、設計節、実装タスク、試験ケース、検証方法へ対応付ける。「業務フローと責務」「処理フロー」「データ契約と状態」
      「インターフェースと失敗時の結果」により、業務フローを満たす責務、データ・境界契約、失敗時の結果と復旧を明確にする。方式の比較中は候補と確定条件を示し、根拠なくモジュール名、ファイル名、pytest 関数名を固定しない。重要な技術選定には採用内容、根拠、代替案、不変条件を記述する。
      「試験設計」では全ScenarioをTC-ID付き試験ケースに対応付け、前提、操作、期待値、テスト層を先に定める。方式と配置を確定した後、tasks.md 確定前に pytest 実装先を記載する。
      「網羅性確認」で全Scenarioの対応状況を確認し、実装変更を伴うScenarioに手動試験のみを許可しない。該当する場合は
      セキュリティ、性能、運用、移行、ロールバックを具体化する。仕様、採用方式、
      タスク分解を変更し得る未解決事項は推測で埋めず「未決事項」に明記し、解決するまで tasks.md を確定しない。
    requires:
      - specs
  - id: tasks
    generates: tasks.md
    description: 設計を実装・検証可能な順序に分解した実施チェックリスト
    template: tasks.md
    instruction: >
      実装可否を左右する未決事項がないことを確認し、proposal.md、specs、確定した design.md を根拠に tasks.md を日本語で作成する。各タスクは `- [ ] X.Y` のチェックボックス形式にし、
      一意なタスク番号、確定した変更対象、具体的な実施内容、対応する要件・設計節・TC-ID、検証可能な完了条件を含める。design.md の「要件トレーサビリティ」の実装タスク番号と一致させる。依存関係順に並べ、
      全要件とTC-IDに対応する自動テスト実装タスク、品質チェック、移行・運用作業を含める。「実装する」「テストを追加する」だけの曖昧なタスクを
      作らない。実施・検証済みの場合のみチェックボックスを完了にする。
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    proposal、specs、design、tasks とプロジェクトコンテキストを読み、未完了タスクを依存関係順に実施する。
    各タスクの完了条件を検証してからチェックボックスを完了にする。仕様・設計にない重要な判断やブロッカーがある場合は、
    実装を進めずに変更成果物または利用者との合意を先に更新する。
